name: Build Interview Report PDF

on:
  push:
    branches:
      - report-pdf-build
    paths:
      - 'report/**'
      - 'prompt images/**'
      - '.github/workflows/build-interview-report.yml'
  workflow_dispatch:

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended latexmk

      - name: Compile report
        working-directory: report
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error Sports_Squad_Interview_Report.tex
          ls -lh Sports_Squad_Interview_Report.pdf

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: sports-squad-interview-report-pdf
          path: report/Sports_Squad_Interview_Report.pdf
          retention-days: 1
